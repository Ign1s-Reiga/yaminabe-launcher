name: Release

# Push a version tag (e.g. `v0.6.0`) to build the Windows installer and attach
# it to a draft GitHub Release. Can also be run by hand from the Actions tab,
# which builds the installer as an artifact and drafts nothing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Windows installer
    runs-on: windows-latest
    env:
      YAMINABE_AZURE_CLIENT_ID: ${{ secrets.YAMINABE_AZURE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: yaminabe-launcher

      - name: Set up the build
        uses: ./yaminabe-launcher/.github/actions/setup

      - name: Read the version
        id: version
        shell: bash
        working-directory: yaminabe-launcher
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          app=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src-tauri/tauri.conf.json)
          if [ "$crate" != "$app" ]; then
            echo "::error::Cargo.toml says $crate but tauri.conf.json says $app"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      # The changelog, written once and used twice: the launcher shows
      # CHANGELOG.md itself, so this version's section there is the release
      # notes, and a version without one would be missing them in the app too.
      - name: Take the release notes from CHANGELOG.md
        shell: bash
        working-directory: yaminabe-launcher
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $VERSION " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      # Without it the build succeeds and Microsoft sign-in fails at runtime.
      - name: Check the Azure client id is set
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ -z "$YAMINABE_AZURE_CLIENT_ID" ]; then
            echo "::error::the YAMINABE_AZURE_CLIENT_ID secret is not set, so sign-in would not work"
            exit 1
          fi

      # `tauri build` runs `beforeBuildCommand` (`trunk build`) itself.
      - name: Build installer
        shell: bash
        working-directory: yaminabe-launcher
        run: npx --yes @tauri-apps/cli@2.12.1 build -- --locked

      - name: Check the stylesheet was bundled
        shell: bash
        working-directory: yaminabe-launcher/src-ui
        run: |
          if [ ! -s assets/bundle.css ]; then
            echo "::error::assets/bundle.css is empty, so the UI would ship unstyled"
            exit 1
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: yaminabe-launcher-${{ steps.version.outputs.version }}-msi
          path: yaminabe-launcher/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

      # A draft, so the release is looked over before anyone can download it.
      - name: Draft the release
        if: github.ref_type == 'tag'
        shell: bash
        working-directory: yaminabe-launcher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/bundle/msi/*.msi \
            --draft --verify-tag \
            --title "Yaminabe Launcher $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
