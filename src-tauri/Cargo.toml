[package]
name = "yaminabe-launcher"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "yaminabe_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
yaminabe-launcher-shared.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["full"] }
log.workspace = true
zip = { version = "8", default-features = false, features = ["deflate", "deflate64"] }
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
keyring-core = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", default-features = false, features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = [
    "crypto-rust",
    "vendored",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.0.0", default-features = false }
